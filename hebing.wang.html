<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebing Wang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
            position: relative;
            z-index: 2;
        }
        
        .profile {
            background-color: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        
        .contact-info {
            background-color: #f5f7fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        
        .contact-info p {
            margin: 10px 0;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }
        
        .contact-info p a {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .contact-info p a:hover {
            color: #2980b9;
        }
        
        .icon {
            margin-right: 10px;
            color: #3498db;
        }
        
        .decoration {
            position: absolute;
            z-index: 1;
        }
        
        .decoration-1 {
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background-color: rgba(52, 152, 219, 0.1);
            border-radius: 50%;
        }
        
        .decoration-2 {
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            background-color: rgba(46, 204, 113, 0.1);
            border-radius: 50%;
        }
        
        .pattern {
            position: absolute;
            opacity: 0.3;
        }
        
        .pattern-1 {
            top: 20%;
            right: 5%;
            width: 150px;
            height: 150px;
            background-image: url('https://source.unsplash.com/random/150x150?abstract');
            background-size: cover;
            border-radius: 50%;
            filter: blur(1px);
        }
        
        .pattern-2 {
            bottom: 10%;
            left: 5%;
            width: 100px;
            height: 100px;
            background-image: url('https://source.unsplash.com/random/100x100?geometric');
            background-size: cover;
            border-radius: 8px;
            filter: blur(1px);
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background-image: url('https://ui-avatars.com/api/?name=Hebing+Wang&background=3498db&color=fff&size=120');
            background-size: cover;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }
            
            .profile {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <div class="container">
        <div class="profile">
            <div class="pattern pattern-1"></div>
            <div class="pattern pattern-2"></div>
            
            <div class="profile-header">
                <div class="avatar"></div>
                <h1>Hebing Wang</h1>
                <div class="subtitle">Minimalist Yet Sophisticated</div>
            </div>
            
            <div class="contact-info">
                <p>
                    <span class="icon">📧</span>
                    <a href="mailto:hebing.wang@genstore.ai">hebing.wang@genstore.ai</a>
                </p>
                <p>
                    <span class="icon">📧</span>
                    <a href="mailto:hebing.wang@weimob.com">hebing.wang@weimob.com</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
